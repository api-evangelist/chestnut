name: Chestnut
description: >-
  Chestnut is an AI-native operating system for insurance distribution, built for
  insurance carriers to manage the entire producer lifecycle. The Seattle-based,
  Andreessen Horowitz-backed company combines a purpose-built insurance data model
  with an API-first architecture and an agentic AI layer, providing producer
  onboarding automation (including NIPR integration), hierarchy configuration,
  incentive compensation management, debt management, performance tracking, and
  compensation intelligence. Chestnut positions its platform as a system of record
  that bridges carriers' operational needs to an agentic AI future, with an
  API-first, MCP-ready backend. Its public API and developer documentation are
  gated for carrier customers, so no public specification is available for the
  catalog at this time.
